<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Химия — ATexted prototype</title>
<style>

.topbar{grid-area:top;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 8px;min-width:0}.brand{font-weight:700;font-size:13px;padding:0 5px 0 2px}.modeSwitch{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fafbfc}.modeBtn{height:27px;border:0;border-right:1px solid var(--line);background:transparent;padding:0 11px;color:#5f6975;font-size:11px}.modeBtn:last-child{border-right:0}.modeBtn:hover{background:#f3f5f8}.modeBtn.active{background:var(--accentSoft);color:#234cae}.sep{height:20px;width:1px;background:var(--line);margin:0 1px}.iconBtn,.topBtn{height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#525d69}.iconBtn{width:30px;font-size:15px}.topBtn{padding:0 9px;font-size:11px;gap:5px}.iconBtn:hover,.topBtn:hover{background:#f4f6f8;border-color:#c8cfd7}.iconBtn:disabled{opacity:.38;cursor:default}#multiInsertBtn.active{background:var(--accentSoft);border-color:#9eb1e8;color:#244cab;font-weight:650}.insertBtn{margin-left:auto;background:var(--accent);border-color:#2f5cc3;color:#fff;font-weight:650}.insertBtn:hover{background:#2e5cc5}
.left{grid-area:left;background:#fff;border-right:1px solid var(--line);min-height:0;overflow:auto;padding:8px}.right{grid-area:right;background:#fff;border-left:1px solid var(--line);min-height:0;overflow:auto}.canvasWrap{grid-area:canvas;position:relative;min-width:0;min-height:0;background:#fbfcfd;overflow:hidden}#canvas{width:100%;height:100%;display:block;touch-action:none}
.exportDialog{width:min(760px,calc(100vw - 48px));height:min(520px,calc(100vh - 48px))}
.exportBody{height:calc(100% - 36px);display:grid;grid-template-rows:minmax(0,1fr) 43px}

.exportFooter{border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 9px}
.exportHint{font-size:10px;color:var(--muted)}

.exportCopy:hover{background:#2e5cc5}

.tourStep{font-size:10px;color:#77818d;margin-bottom:6px}.tourTitle{font-size:15px;font-weight:720;margin-bottom:7px}.tourText{font-size:11px;line-height:1.55;color:#59636e}
.tourActions{display:flex;align-items:center;gap:6px;margin-top:13px}.tourActions button{height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 9px;font-size:10px}.tourActions button:hover{background:#f4f6f8}.tourActions .tourNext{margin-left:auto;background:var(--accent);border-color:#2f5cc3;color:#fff;font-weight:650}.tourActions .tourNext:hover{background:#2e5cc5}
.toolSection{margin-bottom:12px}.toolTitle{font-size:10px;color:#78828e;margin:0 0 5px 2px}.toolGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.toolGrid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.tool{min-width:0;height:47px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:3px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;color:#48515c}.tool:hover{background:#f8f9fb;border-color:#bfc7d0}.tool.active{background:var(--accentSoft);border-color:#98ade9;color:#244cad}.tool .symbol{font-weight:700;font-size:16px;line-height:1}.tool .caption{font-size:8.5px;color:#75808c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}.tool svg{width:31px;height:20px;overflow:visible}.compactSelect{width:100%;height:29px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 7px;font-size:11px}
.panelHead{height:34px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);font-weight:650}.props{padding:10px}.emptyInfo{color:#6f7985;line-height:1.55;font-size:11px}.infoBox{border:1px solid var(--line);background:#fafbfc;border-radius:7px;padding:8px;margin-bottom:8px}.propGrid{display:grid;grid-template-columns:86px minmax(0,1fr);gap:7px 8px;align-items:center}.propGrid label{font-size:10px;color:#69737f}.propGrid input,.propGrid select{width:100%;height:27px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 6px;font-size:11px}.kbd{display:inline-block;border:1px solid #cfd5dc;border-bottom-color:#b9c0c8;border-radius:4px;background:#fff;padding:0 4px;font:9px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:#58626d}
.statusStrip{position:absolute;left:9px;top:9px;display:flex;gap:5px;align-items:center;pointer-events:none}.statusPill{height:23px;display:flex;align-items:center;padding:0 7px;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.93);color:#69737f;font-size:10px}.toast{position:absolute;right:12px;bottom:12px;background:#252b32;color:#fff;border-radius:6px;padding:7px 10px;font-size:10px;opacity:0;transform:translateY(5px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
.atomHit{fill:transparent;cursor:pointer}.atomSel{display:none;fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}.atom.selected .atomSel{display:block}.atomLabel{font-size:17px;font-weight:650;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#fbfcfd;stroke-width:5px;pointer-events:none}.atomExtra,.atomCharge{font-size:10px;font-weight:650;pointer-events:none;paint-order:stroke;stroke:#fbfcfd;stroke-width:3px}.atom-C,.atom-H,.atom-B,.atom-Si{fill:#242a30}.atom-N{fill:#315bc7}.atom-O{fill:#cc4141}.atom-S{fill:#b48100}.atom-P{fill:#c56a26}.atom-hal{fill:#2f8959}.valenceWarn{fill:var(--warn);font-size:11px;font-weight:800;text-anchor:middle;pointer-events:none}
.bondHit{fill:none;stroke:transparent;stroke-width:15;cursor:pointer}.bondLine{stroke:var(--bond);stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}.bond.selected .bondLine{stroke:var(--accent)}.selectionBox{fill:rgba(53,103,220,.07);stroke:var(--accent);stroke-width:1.2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}.preview{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
.reactionArrow,.electronArrow,.textLabel{cursor:pointer}.objSelected{filter:url(#selectedGlow)}.reactionLine{stroke:#2b3138;stroke-width:1.8;fill:none;vector-effect:non-scaling-stroke}.reactionText{font-size:10px;text-anchor:middle;fill:#4b5560;paint-order:stroke;stroke:#fbfcfd;stroke-width:4px}.plusText,.labelText{font-size:23px;text-anchor:middle;dominant-baseline:middle;fill:#30363d;paint-order:stroke;stroke:#fbfcfd;stroke-width:4px}.labelText{font-size:12px}
.bondStereoLabel{font-size:11px;font-weight:750;fill:#b43e49;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#fbfcfd;stroke-width:4px;pointer-events:none}

.stereoText{font-size:11px;font-weight:700;fill:#bb3f47;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#fbfcfd;stroke-width:4px}
.polymerBracket{cursor:pointer}
.polymerBracket .bracketLine{fill:none;stroke:#343b43;stroke-width:1.7;vector-effect:non-scaling-stroke}
.polymerBracket .bracketHit{fill:transparent;stroke:transparent;stroke-width:16}
.polymerBracket .repeatIndex{font-size:17px;fill:#2d333a;font-weight:550}
.polymerBracket.objSelected .bracketLine{stroke:var(--accent)}
.groupHint{font-size:9px;color:#79838f;line-height:1.35;margin-top:5px}.eArrow{stroke:#365fbd;stroke-width:1.8;fill:none;vector-effect:non-scaling-stroke}.eAnchor{fill:#fff;stroke:#365fbd;stroke-width:1.2}
dialog{border:1px solid var(--line2);border-radius:9px;background:#fff;padding:0;box-shadow:0 20px 70px rgba(20,27,38,.2);color:var(--text)}dialog::backdrop{background:rgba(40,45,55,.22)}.dialogHead{height:36px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 9px;font-weight:650}.customAtomDialog{width:390px;max-width:calc(100vw - 36px)}
.customAtomBody{padding:14px}
.customAtomField{display:grid;grid-template-columns:92px minmax(0,1fr);gap:9px;align-items:center}
.customAtomField label{font-size:10px;color:#68737f}
.customAtomField input{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;outline:none}
.customAtomField input:focus{border-color:#8ca7ea;box-shadow:0 0 0 2px rgba(53,103,220,.08)}
.customAtomPreview{margin-top:12px;border:1px solid var(--line);border-radius:7px;background:#fafbfc;min-height:58px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:650;color:#29313a}
.customAtomHelp{margin-top:8px;color:#74808c;font-size:10px;line-height:1.45}
.customAtomActions{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
.customAtomActions button{height:29px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 11px;font-size:10px}
.customAtomActions button:hover{background:#f4f6f8}
.customAtomActions .primary{background:var(--accent);border-color:#2f5cc3;color:#fff;font-weight:650}
.customAtomActions .primary:hover{background:#2e5cc5}
.periodic{width:480px;max-width:calc(100vw - 40px)}.periodicBody{padding:9px;display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.elementChoice{height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:650}.elementChoice:hover{background:var(--accentSoft);border-color:#9fb2e7}.dialogClose{margin-left:auto;border:0;background:transparent;font-size:18px;color:#68727e}
</style>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand">Химия</div>
  <div class="modeSwitch">
    <button class="modeBtn active" data-mode="structure">Структура</button>
    <button class="modeBtn" data-mode="reaction">Реакция</button>
    <button class="modeBtn" data-mode="mechanism">Механизм</button>
  </div>
  <div class="sep"></div>
  <button class="iconBtn" id="undoBtn" title="Отменить — Ctrl/Cmd+Z">↶</button>
  <button class="iconBtn" id="redoBtn" title="Повторить — Ctrl/Cmd+Shift+Z">↷</button>
  <button class="topBtn" id="multiInsertBtn" title="Оставлять выбранный инструмент активным после вставки">Мультивставка</button>
  <button class="topBtn" id="clearBtn" title="Очистить схему">Очистить</button>
  <button class="topBtn insertBtn" id="insertBtn">Вставить в документ</button>
</header>
<aside class="left"><div id="tools"></div></aside>
<section class="canvasWrap">
<svg id="canvas" viewBox="0 0 1400 900">
<defs>
  <pattern id="minorGrid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#eef1f4" stroke-width="1"/></pattern>
  <filter id="selectedGlow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#3567dc" flood-opacity=".45"/></filter>
  <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b3138"/></marker>
  <marker id="electronHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#365fbd"/></marker>
</defs>
<rect x="-10000" y="-10000" width="20000" height="20000" fill="#fbfcfd"/><rect x="-10000" y="-10000" width="20000" height="20000" fill="url(#minorGrid)"/>
<g id="bondLayer"></g><g id="atomLayer"></g><g id="reactionLayer"></g><g id="mechanismLayer"></g><g id="polymerLayer"></g><g id="labelLayer"></g>
<path id="previewPath" class="preview" visibility="hidden"/><rect id="marquee" class="selectionBox" visibility="hidden"/>
</svg>
<div class="statusStrip"><div class="statusPill" id="modePill">Структура</div><div class="statusPill" id="toolPill">Выбор</div></div>
<div class="toast" id="toast"></div>
</section>
<aside class="right"><div class="panelHead" id="propsTitle">Свойства</div><div class="props" id="props"></div></aside>
<dialog id="exportDialog" class="exportDialog">
  <div class="dialogHead">LaTeX-код<button class="dialogClose" id="exportClose">×</button></div>
  <div class="exportBody">
    <textarea id="exportCode" readonly spellcheck="false"></textarea>
    <div class="exportFooter">
      <div class="exportHint">Код сформирован из текущей химической схемы.</div>
      <button class="exportCopy" id="exportCopy">Копировать</button>
    </div>
  </div>
</dialog>

<div id="tour" class="tour" hidden>
  <div class="tourShade" id="tourShadeTop"></div>
  <div class="tourShade" id="tourShadeLeft"></div>
  <div class="tourShade" id="tourShadeRight"></div>
  <div class="tourShade" id="tourShadeBottom"></div>
  <div class="tourFocus" id="tourFocus"></div>
  <div class="tourCard" id="tourCard">
    <div class="tourStep" id="tourStep"></div>
    <div class="tourTitle" id="tourTitle"></div>
    <div class="tourText" id="tourText"></div>
    <div class="tourActions">
      <button id="tourSkip">Пропустить</button>
      <button id="tourBack">Назад</button>
      <button class="tourNext" id="tourNext">Далее</button>
    </div>
  </div>
</div>
</div>
<dialog id="customAtomDialog" class="customAtomDialog">
  <div class="dialogHead">Свой атом<button class="dialogClose" id="customAtomClose">×</button></div>
  <div class="customAtomBody">
    <div class="customAtomField">
      <label for="customAtomInput">Обозначение</label>
      <input id="customAtomInput" type="text" value="NH2" autocomplete="off" spellcheck="false" placeholder="NH2, SO3H, OMe, R…">
    </div>
    <div class="customAtomPreview" id="customAtomPreview">NH₂</div>
    <div class="customAtomHelp" id="customAtomHelp">После нажатия «Вставить» щёлкните по холсту в нужном месте.</div>
    <div class="customAtomActions">
      <button id="customAtomCancel">Отмена</button>
      <button class="primary" id="customAtomInsert">Вставить</button>
    </div>
  </div>
</dialog>

<dialog id="periodicDialog" class="periodic"><div class="dialogHead">Элементы<button class="dialogClose" id="periodicClose">×</button></div><div class="periodicBody" id="periodicBody"></div></dialog>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',BOND_LEN=62;
const S={mode:'structure',tool:{kind:'select',value:'select'},atoms:[],bonds:[],rings:[],reactionArrows:[],electronArrows:[],labels:[],polymerBrackets:[],next:{atom:1,bond:1,ring:1,reaction:1,electron:1,label:1,polymer:1},selection:{atoms:new Set(),bonds:new Set(),reaction:new Set(),electron:new Set(),labels:new Set(),polymer:new Set()},interaction:null,history:[],historyIndex:-1,view:{x:0,y:0,w:1400,h:900},space:false,generatedLatex:'',settings:{showCarbons:true},multiInsert:false};
const D={app:document.getElementById('app'),tools:document.getElementById('tools'),canvas:document.getElementById('canvas'),atomLayer:document.getElementById('atomLayer'),bondLayer:document.getElementById('bondLayer'),reactionLayer:document.getElementById('reactionLayer'),mechanismLayer:document.getElementById('mechanismLayer'),polymerLayer:document.getElementById('polymerLayer'),labelLayer:document.getElementById('labelLayer'),preview:document.getElementById('previewPath'),marquee:document.getElementById('marquee'),props:document.getElementById('props'),propsTitle:document.getElementById('propsTitle'),exportDialog:document.getElementById('exportDialog'),exportCode:document.getElementById('exportCode'),modePill:document.getElementById('modePill'),toolPill:document.getElementById('toolPill'),undo:document.getElementById('undoBtn'),redo:document.getElementById('redoBtn'),toast:document.getElementById('toast'),periodic:document.getElementById('periodicDialog'),periodicBody:document.getElementById('periodicBody'),customAtomDialog:document.getElementById('customAtomDialog'),customAtomInput:document.getElementById('customAtomInput'),customAtomPreview:document.getElementById('customAtomPreview'),customAtomHelp:document.getElementById('customAtomHelp')};
const ELEMENTS=['C','N','O','S','P','F','Cl','Br','I'],MORE=['H','B','Si','Se','Na','K','Li','Mg','Ca','Al','Fe','Cu','Zn','Ag','Au','Hg'];
const svg=(tag,a={})=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a))n.setAttribute(k,String(v));return n};
const A=id=>S.atoms.find(x=>x.id===id),B=id=>S.bonds.find(x=>x.id===id),R=id=>S.reactionArrows.find(x=>x.id===id),E=id=>S.electronArrows.find(x=>x.id===id),L=id=>S.labels.find(x=>x.id===id),PBR=id=>S.polymerBrackets.find(x=>x.id===id);
const world=(cx,cy)=>{const p=D.canvas.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(D.canvas.getScreenCTM().inverse())},dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,rad=d=>d*Math.PI/180,norm=d=>{d%=360;if(d<0)d+=360;return d},pointFrom=(a,d,l=BOND_LEN)=>({x:a.x+Math.cos(rad(d))*l,y:a.y+Math.sin(rad(d))*l}),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function snapAngle(d,s=30){return Math.round(d/s)*s}
function deepState(){return JSON.stringify({atoms:S.atoms,bonds:S.bonds,rings:S.rings,reactionArrows:S.reactionArrows,electronArrows:S.electronArrows,labels:S.labels,polymerBrackets:S.polymerBrackets,next:S.next})}
function pushHistory(){const s=deepState();S.history=S.history.slice(0,S.historyIndex+1);if(S.history.at(-1)===s)return;S.history.push(s);if(S.history.length>120)S.history.shift();S.historyIndex=S.history.length-1;updateUndoRedo()}
function restoreHistory(i){if(i<0||i>=S.history.length)return;const d=JSON.parse(S.history[i]);S.atoms=d.atoms;S.bonds=d.bonds;S.rings=d.rings;S.reactionArrows=d.reactionArrows;S.electronArrows=d.electronArrows;S.labels=d.labels;S.polymerBrackets=d.polymerBrackets||[];S.next=d.next;if(S.next.polymer==null)S.next.polymer=1;S.historyIndex=i;clearSelection();renderAll();updateUndoRedo()}
function updateUndoRedo(){D.undo.disabled=S.historyIndex<=0;D.redo.disabled=S.historyIndex>=S.history.length-1}
function toast(msg){D.toast.textContent=msg;D.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>D.toast.classList.remove('show'),1400)}
function clearSelection(){Object.values(S.selection).forEach(s=>s.clear())}
function selectionCount(){return Object.values(S.selection).reduce((n,s)=>n+s.size,0)}
function hasSelection(){return selectionCount()>0}
function setMode(mode){S.mode=mode;document.querySelectorAll('.modeBtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));D.modePill.textContent={structure:'Структура',reaction:'Реакция',mechanism:'Механизм'}[mode];setTool('select','select',false);renderTools();renderProps()}
document.querySelectorAll('.modeBtn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function toolButton(kind,value,caption,content,title=''){return `<button class="tool${S.tool.kind===kind&&String(S.tool.value)===String(value)?' active':''}" data-kind="${kind}" data-value="${value}" title="${title||caption}">${content||`<span class="symbol">${value}</span>`}<span class="caption">${caption}</span></button>`}
function bondIcon(t){const p={single:'M3 10H29',double:'M3 7H29M3 13H29',triple:'M3 5H29M3 10H29M3 15H29'};if(p[t])return `<svg viewBox="0 0 32 20"><path d="${p[t]}" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`;if(t==='aromatic')return `<svg viewBox="0 0 32 20"><path d="M3 7H29M3 13H29" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3"/></svg>`;if(t==='wedge')return `<svg viewBox="0 0 32 20"><path d="M3 10L29 3V17Z" fill="currentColor"/></svg>`;if(t==='dash')return `<svg viewBox="0 0 32 20"><path d="M4 10L28 4M10 11L28 7M16 12L28 10M22 13L28 13" stroke="currentColor" stroke-width="1.2"/></svg>`;return `<svg viewBox="0 0 32 20"><path d="M3 10C10 2 22 18 29 10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`}
function ringIcon(n,bz=false){const pts=[];for(let i=0;i<n;i++){const a=-90+i*360/n;pts.push([16+Math.cos(rad(a))*11,10+Math.sin(rad(a))*8])}return `<svg viewBox="0 0 32 20"><polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.5"/>${bz?'<circle cx="16" cy="10" r="4.5" fill="none" stroke="currentColor" stroke-width="1.1"/>':''}</svg>`}

function setTool(kind,value,rerender=true){S.tool={kind,value};D.toolPill.textContent={select:'Выбор',atom:`Атом ${value}`,bond:'Связь',ring:'Кольцо',fragment:`Фрагмент ${value}`,reaction:'Реакция',electron:value==='pair'?'Перенос пары e⁻':'Перенос одного e⁻',mechanism:'Механизм'}[kind]||value;if(rerender)renderTools()}

function formatCustomAtomPreview(value){
  const clean=String(value||'').trim();

function openCustomAtomDialog(){
  const one=selectedObject();
  const selectedAtom=one?.kind==='atom'?one.obj:null;
  D.customAtomInput.value=selectedAtom?.customLabel||'NH2';
  D.customAtomPreview.textContent=formatCustomAtomPreview(D.customAtomInput.value);
  D.customAtomHelp.textContent=selectedAtom
    ? 'Нажмите «Вставить», чтобы заменить обозначение выбранного атома.'
    : 'Нажмите «Вставить», затем щёлкните по холсту в нужном месте.';
  D.customAtomDialog.showModal();
  setTimeout(()=>{D.customAtomInput.focus();D.customAtomInput.select()},30);

function confirmCustomAtom(){
  const value=D.customAtomInput.value.trim();
  if(!value){D.customAtomInput.focus();return}
  const one=selectedObject();
  if(one?.kind==='atom'){
    one.obj.customLabel=value;
    pushHistory();
    D.customAtomDialog.close();
    setTool('select','select',true);
    renderAll();
    return
  }
  D.customAtomDialog.close();
  setTool('customAtom',value,true);
  toast(`Выбран свой атом: ${prettyCustomLabel(value)}`);
}

function addAtom(element,x,y,props={}){const a={type:'Atom',id:S.next.atom++,element,x,y,customLabel:'',charge:0,isotope:'',hydrogens:0,hMode:'Auto',radical:'none',lonePairs:0,...props};S.atoms.push(a);return a}
function addBond(a,b,bondType='single',props={}){if(a===b)return null;let ex=S.bonds.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));if(ex){ex.bondType=bondType;ex.order=bondType==='double'?2:bondType==='triple'?3:bondType==='aromatic'?1.5:1;return ex}const bond={type:'Bond',id:S.next.bond++,a,b,bondType,stereo:'none',stereoLabel:'none',order:bondType==='double'?2:bondType==='triple'?3:bondType==='aromatic'?1.5:1,...props};S.bonds.push(bond);return bond}
function addRing(atomIds,bondIds,kind){const r={type:'Ring',id:S.next.ring++,atomIds,bondIds,kind};S.rings.push(r);return r}
function addReactionArrow(x,y,kind='forward'){const r={type:'ReactionArrow',id:S.next.reaction++,x,y,kind,top:'',bottom:'',length:130};S.reactionArrows.push(r);return r}
function addLabel(x,y,text='+',kind='text'){const l={type:'TextLabel',id:S.next.label++,x,y,text,kind};S.labels.push(l);return l}
function boundsForAtoms(ids,padding=22){
  const atoms=ids.map(A).filter(Boolean);
  if(!atoms.length)return null;
  return{
    x1:Math.min(...atoms.map(a=>a.x))-padding,
    y1:Math.min(...atoms.map(a=>a.y))-padding,
    x2:Math.max(...atoms.map(a=>a.x))+padding,
    y2:Math.max(...atoms.map(a=>a.y))+padding
  };
}
function addPolymerBracket(atomIds,index='n'){
  const ids=[...new Set(atomIds)].filter(id=>A(id));
  const b=boundsForAtoms(ids);
  if(!b)return null;
  const obj={type:'PolymerBracket',id:S.next.polymer++,atomIds:ids,index,delimiters:'[]',padding:22,...b};
  S.polymerBrackets.push(obj);
  clearSelection();S.selection.polymer.add(obj.id);
  return obj;
}

function endpoint(ep){if(ep?.target?.kind==='atom'){const a=A(ep.target.id);if(a)return{x:a.x,y:a.y}}if(ep?.target?.kind==='bond'){const b=B(ep.target.id),a=A(b?.a),c=A(b?.b);if(a&&c)return{x:(a.x+c.x)/2,y:(a.y+c.y)/2}}return ep?.point||{x:0,y:0}}
function selectedObject(){if(selectionCount()!==1)return null;if(S.selection.atoms.size)return{kind:'atom',obj:A([...S.selection.atoms][0])};if(S.selection.bonds.size)return{kind:'bond',obj:B([...S.selection.bonds][0])};if(S.selection.reaction.size)return{kind:'reaction',obj:R([...S.selection.reaction][0])};if(S.selection.electron.size)return{kind:'electron',obj:E([...S.selection.electron][0])};if(S.selection.labels.size)return{kind:'label',obj:L([...S.selection.labels][0])};if(S.selection.polymer.size)return{kind:'polymer',obj:PBR([...S.selection.polymer][0])};return null}
function atomClass(e){if(e==='N')return'atom-N';if(e==='O')return'atom-O';if(e==='S')return'atom-S';if(e==='P')return'atom-P';if(['F','Cl','Br','I'].includes(e))return'atom-hal';return'atom-C'}
function bondSum(id){return S.bonds.filter(b=>b.a===id||b.b===id).reduce((n,b)=>n+(b.order||1),0)}function valenceLimit(e){return({C:4,N:3,O:2,S:6,P:5,F:1,Cl:1,Br:1,I:1,H:1,B:3,Si:4})[e]||8}
function atomNeedsLabel(a){if(a.customLabel)return true;if(a.element!=='C')return true;if(S.settings.showCarbons)return true;return !!(a.charge||a.isotope||a.hMode==='Show'||a.radical!=='none'||a.lonePairs||S.bonds.filter(b=>b.a===a.id||b.b===a.id).length===0)}
function shorten(a,b,da,db){const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l;return[{x:a.x+ux*da,y:a.y+uy*da},{x:b.x-ux*db,y:b.y-uy*db}]}

  const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2,dx=p2.x-p1.x,dy=p2.y-p1.y,ll=Math.hypot(dx,dy)||1,nx=-dy/ll,ny=dx/ll;

g.onpointerdown=objectDown;D.bondLayer.appendChild(g)}}
const SUBDIG={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
function subNumber(n){return String(n).split('').map(c=>SUBDIG[c]||c).join('')}
function prettyCustomLabel(s){return String(s||'').replace(/(\d+)/g,m=>subNumber(m))}
function atomDisplayText(a){
  if(a.customLabel)return prettyCustomLabel(a.customLabel);
  if(a.hMode==='Show'&&a.hydrogens>0){
    const h='H'+(a.hydrogens>1?subNumber(a.hydrogens):'');
    return a.element+h;
  }
  return a.element;
}
function customLabelLatex(s){return String(s||'').replace(/(\d+)/g,'_$1')}
function atomLatexText(a){
  let t=a.customLabel?customLabelLatex(a.customLabel):a.element;
  if(!a.customLabel&&a.hMode==='Show'&&a.hydrogens>0)t+=a.hydrogens>1?`H_${a.hydrogens}`:'H';
  if(a.charge)t=`{${t}}^{${Math.abs(a.charge)>1?Math.abs(a.charge):''}${a.charge>0?'+':'-'}}`;
  return t;
}
function renderAtoms(){D.atomLayer.replaceChildren();for(const a of S.atoms){const g=svg('g',{class:'atom'+(S.selection.atoms.has(a.id)?' selected':''),'data-id':a.id});g.appendChild(svg('circle',{class:'atomSel',cx:a.x,cy:a.y,r:16}));g.appendChild(svg('circle',{class:'atomHit',cx:a.x,cy:a.y,r:17}));if(atomNeedsLabel(a)){const t=svg('text',{class:`atomLabel ${atomClass(a.element)}`,x:a.x,y:a.y});t.textContent=atomDisplayText(a);g.appendChild(t);if(a.isotope){const n=svg('text',{class:'atomExtra',x:a.x-13,y:a.y-9});n.textContent=a.isotope;g.appendChild(n)}if(a.charge){const n=svg('text',{class:'atomCharge',x:a.x+10,y:a.y-10});n.textContent=(Math.abs(a.charge)>1?Math.abs(a.charge):'')+(a.charge>0?'+':'−');g.appendChild(n)}if(a.radical!=='none'){const n=svg('text',{class:'atomExtra',x:a.x+10,y:a.y+12});n.textContent='•';g.appendChild(n)}if(a.lonePairs>0){const n=svg('text',{class:'atomExtra',x:a.x-13,y:a.y+12});n.textContent=':'.repeat(Math.min(2,a.lonePairs));g.appendChild(n)}}if(bondSum(a.id)>valenceLimit(a.element)+.01){const w=svg('text',{class:'valenceWarn',x:a.x,y:a.y-23});w.textContent='!';g.appendChild(w)}g.onpointerdown=objectDown;D.atomLayer.appendChild(g)}}
function renderReactions(){D.reactionLayer.replaceChildren();for(const r of S.reactionArrows){const g=svg('g',{class:'reactionArrow'+(S.selection.reaction.has(r.id)?' objSelected':''),'data-id':r.id}),x1=r.x-r.length/2,x2=r.x+r.length/2,y=r.y;g.appendChild(svg('rect',{x:x1-8,y:y-30,width:r.length+16,height:60,fill:'transparent'}));if(r.kind==='forward'){line(g,{x:x1,y},{x:x2,y},'reactionLine',{'marker-end':'url(#arrowHead)'})}else if(r.kind==='reversible'){line(g,{x:x1,y:y-5},{x:x2,y:y-5},'reactionLine',{'marker-end':'url(#arrowHead)'});line(g,{x:x2,y:y+5},{x:x1,y:y+5},'reactionLine',{'marker-end':'url(#arrowHead)'})}else{line(g,{x:x1,y:y-5},{x:x2,y:y-5},'reactionLine');g.appendChild(svg('path',{class:'reactionLine',d:`M${x2} ${y-5} L${x2-10} ${y-11}`}));line(g,{x:x2,y:y+5},{x:x1,y:y+5},'reactionLine');g.appendChild(svg('path',{class:'reactionLine',d:`M${x1} ${y+5} L${x1+10} ${y+11}`}))}if(r.top){const t=svg('text',{class:'reactionText',x:r.x,y:r.y-15});t.textContent=r.top;g.appendChild(t)}if(r.bottom){const t=svg('text',{class:'reactionText',x:r.x,y:r.y+19});t.textContent=r.bottom;g.appendChild(t)}g.onpointerdown=objectDown;D.reactionLayer.appendChild(g)}}
function renderMechanism(){D.mechanismLayer.replaceChildren();for(const e of S.electronArrows){const a=endpoint(e.start),b=endpoint(e.end),mx=(a.x+b.x)/2,my=(a.y+b.y)/2-45,g=svg('g',{class:'electronArrow'+(S.selection.electron.has(e.id)?' objSelected':''),'data-id':e.id});g.appendChild(svg('path',{class:'eArrow',d:`M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}`,'marker-end':'url(#electronHead)'}));if(e.kind==='single')g.appendChild(svg('circle',{cx:b.x-4,cy:b.y-2,r:1.6,fill:'#365fbd'}));g.appendChild(svg('circle',{class:'eAnchor',cx:a.x,cy:a.y,r:3}));g.appendChild(svg('circle',{class:'eAnchor',cx:b.x,cy:b.y,r:3}));g.onpointerdown=objectDown;D.mechanismLayer.appendChild(g)}}
function renderPolymerBrackets(){
  D.polymerLayer.replaceChildren();
  for(const br of S.polymerBrackets){
    let b=br.atomIds?.length?boundsForAtoms(br.atomIds,br.padding||22):br;
    if(!b)continue;
    br.x1=b.x1;br.y1=b.y1;br.x2=b.x2;br.y2=b.y2;
    const g=svg('g',{class:'polymerBracket'+(S.selection.polymer.has(br.id)?' objSelected':''),'data-id':br.id});
    const h=Math.max(18,br.y2-br.y1),cap=Math.min(12,h*.16);
    const left=`M${br.x1+cap} ${br.y1} H${br.x1} V${br.y2} H${br.x1+cap}`;
    const right=`M${br.x2-cap} ${br.y1} H${br.x2} V${br.y2} H${br.x2-cap}`;
    g.appendChild(svg('path',{class:'bracketHit',d:left}));
    g.appendChild(svg('path',{class:'bracketHit',d:right}));
    g.appendChild(svg('path',{class:'bracketLine',d:left}));
    g.appendChild(svg('path',{class:'bracketLine',d:right}));
    const idx=svg('text',{class:'repeatIndex',x:br.x2+8,y:br.y2+4});idx.textContent=br.index||'n';g.appendChild(idx);
    g.onpointerdown=objectDown;
    D.polymerLayer.appendChild(g);
  }
}

  ].map(([v,t])=>`<option value="${v}"${r.kind===v?' selected':''}>${t}</option>`).join('');
  D.props.innerHTML=`<div class="propGrid">
    <label>Тип</label><select id="pRT">${rt}</select>

  bind('pRT','change',x=>r.kind=x.value,true);
  bind('pTop','input',x=>r.top=x.value,true);
  bind('pBottom','input',x=>r.bottom=x.value,true);
  bind('pLen','input',x=>r.length=Number(x.value)||130,true)
}
function electronProps(e){
  D.propsTitle.textContent='Электронная стрелка';
  const et=[
    ['pair','Электронная пара'],['single','Один электрон']
  ].map(([v,t])=>`<option value="${v}"${e.kind===v?' selected':''}>${t}</option>`).join('');
  const dir=[
    ['forward','Прямое'],['reverse','Обратное']
  ].map(([v,t])=>`<option value="${v}"${e.direction===v?' selected':''}>${t}</option>`).join('');

function labelProps(l){D.propsTitle.textContent='Текстовая подпись';D.props.innerHTML=`<div class="propGrid"><label>Текст</label><input id="pText" value="${esc(l.text)}"></div>`;bind('pText','input',x=>l.text=x.value,true)}
function polymerProps(br){

    <label>Индекс</label><input id="pPolyIndex" value="${esc(br.index||'n')}">

  </div><div class="emptyInfo" style="margin-top:10px">Скобки привязаны к ${br.atomIds?.length||0} атомам и автоматически изменяют размер при перемещении структуры.</div>`;
  bind('pPolyIndex','input',x=>br.index=x.value,true);
  bind('pPolyDelim','change',x=>br.delimiters=x.value,true);

}
function adjacency(){const m=new Map(S.atoms.map(a=>[a.id,[]]));for(const b of S.bonds){m.get(b.a)?.push({to:b.b,b});m.get(b.b)?.push({to:b.a,b})}return m}
function connectedComponents(){const ad=adjacency(),seen=new Set(),out=[];for(const a of S.atoms){if(seen.has(a.id))continue;const q=[a.id],ids=[];seen.add(a.id);while(q.length){const id=q.shift();ids.push(id);for(const z of ad.get(id)||[])if(!seen.has(z.to)){seen.add(z.to);q.push(z.to)}}out.push(ids)}return{ad,out}}
function ringForComponent(ids){const set=new Set(ids);return S.rings.find(r=>r.kind==='benzene'&&r.atomIds.every(id=>set.has(id)))}
function benzeneCode(ids){const r=ringForComponent(ids);if(!r)return null;const ringSet=new Set(r.atomIds);let external=null,anchor=null;for(const id of r.atomIds){const b=S.bonds.find(x=>(x.a===id&&!ringSet.has(x.b))||(x.b===id&&!ringSet.has(x.a)));if(b){anchor=id;external=A(b.a===id?b.b:b.a);break}}if(!external)return'\\chemfig{*6(=-=-=-)}';if(external.element==='N'){const os=S.bonds.filter(b=>(b.a===external.id||b.b===external.id)).map(b=>A(b.a===external.id?b.b:b.a)).filter(a=>a&&a.element==='O');if(os.length>=2)return'\\chemfig{*6(=-=-(-N(=O)-O)=-)}'}if(external.element==='O'&&external.hMode==='Show'&&external.hydrogens>0)return'\\chemfig{*6(=-=-(-OH)=-)}';return null}
function atomTok(a){
  if(a.element==='C'&&!atomNeedsLabel(a))return'';
  return atomLatexText(a);
}
function bondTok(b,a,c){const map={single:'-',double:'=',triple:'~',aromatic:':',wedge:'<',dash:'<:',wavy:'~'};return`${map[b.bondType]||'-'}[:${Math.round(-ang(a,c))}]`}
function genericChemfig(ids,ad){const set=new Set(ids),va=new Set(),vb=new Set();let root=ids[0];for(const id of ids){if((ad.get(id)||[]).filter(z=>set.has(z.to)).length===1){root=id;break}}function walk(id,parent=null){const a=A(id);va.add(id);let out=atomTok(a),main=false;for(const z of(ad.get(id)||[]).filter(z=>set.has(z.to)&&z.to!==parent&&!vb.has(z.b.id))){if(vb.has(z.b.id))continue;vb.add(z.b.id);if(va.has(z.to))continue;const c=A(z.to),seg=bondTok(z.b,a,c)+walk(z.to,id);if(!main){out+=seg;main=true}else out+=`(${seg})`}return out}return`\\chemfig{${walk(root)}}`}
function componentCenter(ids){return{x:ids.reduce((s,id)=>s+A(id).x,0)/ids.length,y:ids.reduce((s,id)=>s+A(id).y,0)/ids.length}}
function latexForModel(){const{ad,out}=connectedComponents(),mols=out.map(ids=>{const c=componentCenter(ids);return{x:c.x,code:benzeneCode(ids)||genericChemfig(ids,ad)}}),items=[...mols.map(m=>({x:m.x,kind:'mol',code:m.code})),...S.labels.map(l=>({x:l.x,kind:'label',obj:l})),...S.reactionArrows.map(r=>({x:r.x,kind:'reaction',obj:r}))].sort((a,b)=>a.x-b.x);let body;if(S.reactionArrows.length){body='\\schemestart\n  '+items.map(it=>{if(it.kind==='mol')return it.code;if(it.kind==='label')return it.obj.kind==='plus'?'\\+':`\\chemname{}{${it.obj.text}}`;const r=it.obj,ar=r.kind==='equilibrium'?'<=>':r.kind==='reversible'?'<->':'->';return`\\arrow{${ar}[${r.top}][${r.bottom}]}`}).join(' ')+'\n\\schemestop'}else body=mols.map(m=>m.code).join('\n\\qquad\n')||'\\chemfig{}';if(S.electronArrows.length)body+=`\n% механизм: ${S.electronArrows.length} электронных стрелок`;
const stereoBonds=S.bonds.filter(b=>b.stereoLabel&&b.stereoLabel!=='none');
if(stereoBonds.length)body+=`\n% метки связей: ${stereoBonds.map(b=>b.stereoLabel==='alpha'?'α':'β').join(', ')}`;
if(S.polymerBrackets.length){
  body+='\n% polymer brackets generated from selected repeating units';
  for(const br of S.polymerBrackets){
    body+=`\n% \\polymerdelim[delimiters={${br.delimiters||'[]'}}, indice=${br.index||'n'}]{op${br.id}}{cl${br.id}}`;
  }
}
return`% ATexted chemistry prototype\n\\usepackage{chemfig}\n\\usepackage[version=4]{mhchem}\n\n${body}`}
function updateLatex(){S.generatedLatex=latexForModel()}
async function copyExportCode(){const code=S.generatedLatex||latexForModel();try{await navigator.clipboard.writeText(code)}catch{D.exportCode.focus();D.exportCode.select();document.execCommand('copy')}toast('LaTeX скопирован')}
D.customAtomInput.addEventListener('input',()=>D.customAtomPreview.textContent=formatCustomAtomPreview(D.customAtomInput.value));

document.getElementById('customAtomInsert').onclick=confirmCustomAtom;

document.getElementById('customAtomClose').onclick=()=>D.customAtomDialog.close();

document.getElementById('multiInsertBtn').onclick=()=>{S.multiInsert=!S.multiInsert;const b=document.getElementById('multiInsertBtn');b.classList.toggle('active',S.multiInsert);b.textContent=S.multiInsert?'Мультивставка: вкл':'Мультивставка';toast(S.multiInsert?'Множественная вставка включена':'Множественная вставка выключена')};

document.getElementById('insertBtn').onclick=()=>{updateLatex();D.exportCode.value=S.generatedLatex;D.exportDialog.showModal();setTimeout(()=>D.exportCode.focus(),20)};
D.undo.onclick=()=>restoreHistory(S.historyIndex-1);D.redo.onclick=()=>restoreHistory(S.historyIndex+1);
MORE.forEach(x=>{const b=document.createElement('button');b.className='elementChoice';b.textContent=x;b.onclick=()=>{D.periodic.close();setTool('atom',x,true)};D.periodicBody.appendChild(b)});document.getElementById('periodicClose').onclick=()=>D.periodic.close();
window.addEventListener('keydown',ev=>{if(D.periodic.open||D.exportDialog.open||D.customAtomDialog.open)return;const tag=document.activeElement?.tagName;if(['INPUT','SELECT','TEXTAREA'].includes(tag))return;if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){restoreHistory(S.historyIndex+(ev.shiftKey?1:-1));ev.preventDefault();return}if((ev.key==='Delete'||ev.key==='Backspace')&&hasSelection()){deleteSelection();ev.preventDefault();return}const k=ev.key.toUpperCase();if(['C','N','O','S','P','F'].includes(k)&&S.selection.atoms.size){for(const id of S.selection.atoms){const a=A(id);if(a){a.element=k;a.customLabel=''}}pushHistory();renderAll();ev.preventDefault();return}if(ev.code==='Space'){S.space=true;ev.preventDefault()}if(ev.key==='Escape'){if(!T.root.hidden){closeTour();return}S.interaction=null;D.preview.setAttribute('visibility','hidden');D.marquee.setAttribute('visibility','hidden');clearSelection();renderAll()}});window.addEventListener('keyup',ev=>{if(ev.code==='Space')S.space=false});
function rawRing(center,kind){const n=kind==='benzene'?6:Number(kind),rr=BOND_LEN/(2*Math.sin(Math.PI/n)),ids=[],bids=[];for(let i=0;i<n;i++){const d=-90+i*360/n;ids.push(addAtom('C',center.x+Math.cos(rad(d))*rr,center.y+Math.sin(rad(d))*rr).id)}for(let i=0;i<n;i++){const b=addBond(ids[i],ids[(i+1)%n],kind==='benzene'?(i%2===0?'double':'single'):'single');bids.push(b.id)}addRing(ids,bids,kind);return ids}
function rawNO2(anchorId){const a=A(anchorId),d=bestBondAngle(anchorId),np=pointFrom(a,d),n=addAtom('N',np.x,np.y),p1=pointFrom(n,d),p2=pointFrom(n,d+90,BOND_LEN*.78),o1=addAtom('O',p1.x,p1.y),o2=addAtom('O',p2.x,p2.y);addBond(a.id,n.id);addBond(n.id,o1.id,'double');addBond(n.id,o2.id)}
function starter(){rawRing({x:350,y:400},'benzene');const prod=rawRing({x:980,y:400},'benzene'),anchor=prod.reduce((best,id)=>A(id).x>A(best).x?id:best,prod[0]);rawNO2(anchor);const r=addReactionArrow(670,400,'forward');r.top='HNO₃, H₂SO₄';r.bottom='50 °C';pushHistory();clearSelection();renderAll()}

const TOUR_STEPS=[
 {target:null,title:'Химический редактор',text:'Это специализированный инструмент для структур, реакций и механизмов. Все режимы работают с одной общей схемой. Коротко покажем основной рабочий процесс.'},
 {target:'.modeSwitch',title:'Три режима — один холст',text:'«Структура» строит молекулы, «Реакция» добавляет стрелки и условия, «Механизм» — перенос электронов. Переключение режима ничего не очищает.'},
 {target:'.left',title:'Инструменты химика',text:'Слева только предметные инструменты: атомы, химические связи, кольца и компактный список фрагментов. Обычная вставка одноразовая: после неё включается «Выбор». Фрагменты OH/NH₂ вставляются с явными водородами; α/β и [ ]ₙ находятся в разделе «Обозначения».'},
 {target:'.canvasWrap',title:'Построение и выделение',text:'На холсте выбирайте и перемещайте атомы. Shift+click добавляет объект к выделению, Shift+drag выделяет область. Связи всегда остаются привязанными к атомам.'},
 {target:'.right',title:'Свойства объекта',text:'Правая панель меняется по типу сущности: атом, связь, стрелку реакции или электронную стрелку. Здесь задаются заряд, водороды, стерео и условия реакции.'},
 {target:'#multiInsertBtn',title:'Множественная вставка',text:'Для серии одинаковых вставок включите «Мультивставку». Например: выберите C и кликайте по холсту много раз — инструмент останется активным.'},
 {target:'#insertBtn',title:'Готовый LaTeX',text:'Когда схема готова, нажмите «Вставить в документ». Откроется окно с автоматически сформированным кодом и кнопкой копирования.'}
];
let tourIndex=0;
const T={root:document.getElementById('tour'),focus:document.getElementById('tourFocus'),card:document.getElementById('tourCard'),step:document.getElementById('tourStep'),title:document.getElementById('tourTitle'),text:document.getElementById('tourText'),top:document.getElementById('tourShadeTop'),left:document.getElementById('tourShadeLeft'),right:document.getElementById('tourShadeRight'),bottom:document.getElementById('tourShadeBottom'),back:document.getElementById('tourBack'),next:document.getElementById('tourNext'),skip:document.getElementById('tourSkip')};
function tourRect(el,x,y,w,h){el.style.left=x+'px';el.style.top=y+'px';el.style.width=Math.max(0,w)+'px';el.style.height=Math.max(0,h)+'px'}
function layoutTour(){
 const s=TOUR_STEPS[tourIndex],target=s.target?document.querySelector(s.target):null,W=innerWidth,H=innerHeight,pad=7;
 T.step.textContent=`Шаг ${tourIndex+1} из ${TOUR_STEPS.length}`;T.title.textContent=s.title;T.text.textContent=s.text;T.back.disabled=tourIndex===0;T.next.textContent=tourIndex===TOUR_STEPS.length-1?'Начать работу':'Далее';
 if(!target){tourRect(T.top,0,0,W,H);tourRect(T.left,0,0,0,0);tourRect(T.right,0,0,0,0);tourRect(T.bottom,0,0,0,0);T.focus.style.display='none';T.card.style.left=Math.max(14,(W-330)/2)+'px';T.card.style.top=Math.max(14,(H-205)/2)+'px';return}
 const r=target.getBoundingClientRect(),x=Math.max(0,r.left-pad),y=Math.max(0,r.top-pad),w=Math.min(W-x,r.width+pad*2),h=Math.min(H-y,r.height+pad*2);
 T.focus.style.display='block';tourRect(T.focus,x,y,w,h);tourRect(T.top,0,0,W,y);tourRect(T.bottom,0,y+h,W,H-y-h);tourRect(T.left,0,y,x,h);tourRect(T.right,x+w,y,W-x-w,h);
 const cw=Math.min(330,W-28),ch=190,gap=14;let cx=x+w+gap,cy=y;if(cx+cw>W-14)cx=x-cw-gap;if(cx<14){cx=Math.max(14,Math.min(W-cw-14,x));cy=y+h+gap}if(cy+ch>H-14)cy=Math.max(14,H-ch-14);T.card.style.left=cx+'px';T.card.style.top=cy+'px'
}
function startTour(){tourIndex=0;T.root.hidden=false;layoutTour()}
function closeTour(){T.root.hidden=true}
T.next.onclick=()=>{if(tourIndex>=TOUR_STEPS.length-1)closeTour();else{tourIndex++;layoutTour()}};
T.back.onclick=()=>{if(tourIndex>0){tourIndex--;layoutTour()}};
T.skip.onclick=closeTour;
window.addEventListener('resize',()=>{if(!T.root.hidden)layoutTour()});

renderTools();starter();updateView();setTimeout(startTour,80);
})();
